  </head>
  <body><h1>サッカーワールドカップのニュースです。</h1>
    <p>サッカーワールドカップのニュースです。6日、決勝トーナメントの2回戦でアメリカとベルギーの試合がありました。アメリカのバログン選手は、5日前の1回戦でレッドカードを受けていました。ルールでは、次の試合に出ることができません。アメリカのトランプ大統領はFIFAの会長に電話して、もう一度考えてほしいと言いました。FIFAは、バログン選手にルールを使うことを1年延ばすことにしました。世界の多くの人が、特別な決定だったのではないかと言いました。そして6日、バログン選手はベルギーとの試合に出ました。結果はアメリカが1 - 4で負けました。</p>
