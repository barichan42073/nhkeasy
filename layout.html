<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Smart Japanese Reader</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="controls">
        <button onclick="setMode('none', this)">なし</button>
        <button class="active" onclick="setMode('all', this)">あり</button>
        <button onclick="setMode('hard', this)">むずかしい</button>
    </div>

    <div id="main-content">
        <div class="article-inner mode-all" id="article-body">
            {{ARTICLE_BODY}}
            {{TRANSLATION_SECTION}}
        </div>
    </div>
    
    <div class="sidebar">
        <div id="side-content" class="sidebar-card">
            <p style="color:#94a3b8; text-align:center;">Select a word to see details...</p>
        </div>
    </div>

    <script src="reader.js"></script>
</body>
</html>
